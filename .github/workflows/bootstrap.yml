name: Bootstrap math-ppt source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message == 'chore: add source bundle and bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore full source, examples and SRT
        run: |
          set -euo pipefail
          base64 -d .bootstrap/source.tar.xz.b64 | tar -xJ -C .
          python3 scripts/build_media.py --input examples/tangent-integer-triangle/lesson.json --out examples/tangent-integer-triangle
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: math PPT skill, examples, subtitles and media pipeline"
          git push
